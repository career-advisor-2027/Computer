function updateDateTime(){
 const now = new Date();
 const opts = {weekday:"long", year:"numeric", month:"long", day:"numeric"};
 const dateStr = now.toLocaleDateString(LANG==="ar"?"ar-EG":LANG==="en"?"en-US":"ckb", opts);
 const timeStr = now.toLocaleTimeString(LANG==="ar"?"ar-EG":"en-GB", {hour:"2-digit", minute:"2-digit", second:"2-digit"});
 document.getElementById("datetime").innerText = "📅 " + dateStr + " • ⏰ " + timeStr;
}
setInterval(updateDateTime, 1000); updateDateTime();

document.getElementById("analyzeBtn").onclick=function(){
 const t=T[LANG];
 const name=document.getElementById("studentName").value.trim();
 const skills=document.getElementById("skills").value.trim();
 const interests=document.getElementById("interests").value.trim();
 const status=document.getElementById("statusText");
 const resultBox=document.getElementById("resultBox");
 const cardsBox=document.getElementById("cardsBox");
 if(!name||!skills||!interests){ status.innerText=t.fill; return; }
 status.innerText=t.loading;
 setTimeout(()=>{
  const text=(skills+" "+interests).toLowerCase();
  let list = CAREERS[LANG].map(c=>{ let s=0; c.key.forEach(k=>{ if(text.includes(k.toLowerCase())) s+=30; }); return {...c, score: Math.min(98, c.match + (s>0?2:0))}; });
  list.sort((a,b)=>b.score-a.score);
  let top=list.slice(0,3);
  let txt = t.adviceFor+" "+name+":\n\n";
  let htmlCards="";
  top.forEach((c,i)=>{
   txt += (i+1)+". "+c.title+" ("+c.score+t.fit+")\n"+t.why+" "+c.why+"\n"+t.salary+": "+c.salary+"\n"+t.steps+"\n"+c.steps.map((s,j)=>(j+1)+". "+s).join("\n")+"\n\n";
   htmlCards += '<div class="career-card"><h3>'+(i+1)+'. '+c.title+' <span class="badge">'+c.score+t.fit+'</span></h3><p><b>'+t.why+'</b> '+c.why+'</p><p><b>'+t.salary+':</b> '+c.salary+'</p><p><b>'+t.steps+'</b><br>'+c.steps.join("<br>")+'</p></div>';
  });
  resultBox.innerText=txt; resultBox.style.display="block"; cardsBox.innerHTML=htmlCards;
  status.innerText=t.saved;
  let records=JSON.parse(localStorage.getItem("career_records")||"[]");
  records.unshift({name:name,skills:skills,interests:interests,advice:txt, lang:LANG});
  localStorage.setItem("career_records",JSON.stringify(records));
 },500);
};
function loadHistory(){
 const tbody=document.getElementById("historyTableBody"); tbody.innerHTML="";
 let records=JSON.parse(localStorage.getItem("career_records")||"[]");
 if(records.length===0){ tbody.innerHTML="<tr><td colspan='4' style='text-align:center;'>"+T[LANG].empty+"</td></tr>"; return; }
 records.forEach(r=>{ tbody.innerHTML+="<tr><td><b>"+r.name+"</b></td><td>"+r.skills+"</td><td>"+r.interests+"</td><td>"+r.advice.substring(0,120)+"...</td></tr>"; });
}
document.getElementById("clearBtn").onclick=function(){ localStorage.removeItem("career_records"); loadHistory(); };
applyLang();
