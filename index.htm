<html lang="ku" dir="rtl"><head><style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}
:where(html) {
  font-family: "Optimistic", system-ui, sans-serif;
}
:where(code, pre, kbd, samp) {
  font-family: "Optimistic Mono", ui-monospace, monospace;
}
</style>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Career Advisor</title>
<style>*{box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{margin:0;background:linear-gradient(135deg,#fdf2f8 0%,#eef2ff 30%,#ecfdf5 70%,#fffbeb 100%);min-height:100vh;color:#1e293b}
.topbar{background:linear-gradient(135deg,#0f172a,#0e7490,#06b6d4,#10b981);color:#fff;padding:14px 16px;text-align:center;position:sticky;top:0;z-index:10;box-shadow:0 4px 20px rgba(6,182,212,.35)}
.topbar .datetime{font-size:13px;background:rgba(255,255,255,.22);display:inline-block;padding:6px 14px;border-radius:999px;margin-top:6px}
.topbar h1{margin:0;font-size:22px}
.topbar p{margin:4px 0 0;font-size:12px;opacity:.9}
.lang-bar{display:flex;gap:8px;justify-content:center;margin:14px 0}
.lang-btn{padding:9px 18px;border:2px solid #e2e8f0;background:#fff;border-radius:999px;font-weight:bold;cursor:pointer;font-size:14px}
.lang-btn.active{background:#0e7490;color:#fff;border-color:#0e7490;box-shadow:0 4px 12px rgba(6,182,212,.35)}
.container{max-width:800px;margin:0 auto;padding:0 14px 30px}
.tabs{display:flex;gap:10px;margin-bottom:14px}
.tab-btn{flex:1;padding:13px;border:none;border-radius:14px;background:#fff;color:#334155;font-weight:bold;font-size:14px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.tab-btn.active{background:linear-gradient(135deg,#0e7490,#06b6d4);color:#fff}
.card{background:rgba(255,255,255,.92);backdrop-filter:blur(10px);padding:22px;border-radius:20px;box-shadow:0 8px 30px rgba(0,0,0,.07);border:1px solid #fff}
.form-group{margin-bottom:16px}
label{display:block;font-weight:bold;margin-bottom:7px;font-size:14px}
input{width:100%;padding:14px;border:2px solid #a5f3fc;border-radius:12px;font-size:15px;background:#f0fdff;outline:none}
input:focus{border-color:#06b6d4}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:9px}
.chip{padding:8px 13px;background:#ecfeff;border:1px solid #67e8f9;border-radius:999px;font-size:13px;cursor:pointer}
.chip.active{background:#0e7490;color:#fff}
.btn-submit{width:100%;padding:16px;background:linear-gradient(135deg,#0f172a,#0e7490,#06b6d4,#10b981);color:#fff;border:none;border-radius:14px;font-size:17px;font-weight:bold;cursor:pointer;box-shadow:0 6px 18px rgba(6,182,212,.3)}
.status{margin-top:12px;font-size:13px;text-align:center;font-weight:bold;color:#475569}
.result-box{margin-top:18px;padding:18px;background:#f8fafc;border-radius:14px;white-space:pre-wrap;line-height:1.8;font-size:15px;display:none;border:1px solid #e2e8f0}
.career-card{background:linear-gradient(135deg,#fff,#ecfeff);border:2px solid #67e8f9;border-radius:16px;padding:16px;margin-top:14px}
.career-card h3{margin:0 0 6px;font-size:17px}
.badge{display:inline-block;background:#dcfce7;color:#166534;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:bold}
table{width:100%;border-collapse:collapse;margin-top:10px;font-size:13px}
th,td{border:1px solid #e2e8f0;padding:9px;text-align:start;vertical-align:top}
th{background:#0e7490;color:#fff}
.hidden{display:none}
.footer{text-align:center;font-size:12px;color:#94a3b8;margin-top:16px}

#splash{position:fixed;inset:0;z-index:9999;background:linear-gradient(180deg,#0f172a 0%,#0e7490 55%,#06b6d4 85%,#10b981 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;color:#fff;transition:opacity .6s, visibility .6s}
#splash.hide{opacity:0;visibility:hidden}
#splash img{width:260px;max-width:80vw;height:auto;filter:drop-shadow(0 18px 40px rgba(0,0,0,.45));animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.splash-title{font-size:30px;font-weight:900;margin:18px 0 6px;line-height:1.2}
.splash-sub{font-size:15px;opacity:.92;line-height:1.7;max-width:420px}
.splash-badges{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:14px 0}
.splash-badges span{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);padding:6px 12px;border-radius:999px;font-size:13px;font-weight:bold}
#startBtn{margin-top:18px;padding:16px 44px;font-size:19px;font-weight:900;border:none;border-radius:999px;background:#fff;color:#0f172a;cursor:pointer;box-shadow:0 12px 30px rgba(0,0,0,.35)}
#startBtn:active{transform:scale(.97)}
.splash-foot{margin-top:14px;font-size:12px;opacity:.8}

.new-opt{margin-bottom:16px}
.new-opt label{display:block;font-weight:bold;margin-bottom:7px;font-size:14px}
.new-opt select{width:100%;padding:13px;border:2px solid #a5f3fc;border-radius:12px;font-size:15px;background:#f0fdff;cursor:pointer}
.share-row{display:flex;gap:10px;margin-top:12px}
.share-row button{flex:1;padding:13px;border:none;border-radius:12px;font-weight:bold;cursor:pointer;font-size:14px}
.btn-share{background:#25D366;color:#fff}
.btn-print{background:#0f172a;color:#fff}
.motivation{margin-top:12px;padding:12px;background:#fefce8;border:1px solid #fde68a;border-radius:12px;text-align:center;font-size:13px;line-height:1.6}

</style>
<style>#splash{transition:transform .8s cubic-bezier(.7,0,.3,1), opacity .8s !important;}#splash.slide-up{transform:translateY(-100%)!important;opacity:.9!important;}</style></head>
<body>

<div id="splash" class="slide-up" style="display: none;">
